<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>5CSE A & B CE0522 Web Technology Mini Project</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f9;color:#222}
.container{max-width:850px;margin:40px auto;background:#fff;padding:35px;border-radius:12px;box-shadow:0 5px 25px rgba(0,0,0,.08)}
h1{text-align:center;margin-bottom:8px}.subtitle{text-align:center;color:#666}
.section{margin-top:28px;padding-bottom:8px;border-bottom:2px solid #eee}
.group{margin:18px 0}label{display:block;font-weight:700;margin-bottom:8px}
input,select,textarea{width:100%;padding:12px;border:1px solid #ccc;border-radius:6px;font-size:15px}
textarea{min-height:120px;resize:vertical}
.note{background:#f1f3f4;padding:12px;border-radius:6px;margin:20px 0;font-size:14px}
.msg{padding:14px;margin-bottom:20px;border-radius:6px;display:none}
.success{background:#d4edda;color:#155724}.error{background:#f8d7da;color:#721c24}
button{width:100%;padding:14px;border:0;border-radius:6px;background:#1a73e8;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#1557b0}button:disabled{opacity:.6;cursor:not-allowed}.req{color:red}
</style>
</head>
<body>
<div class="container">
<h1>5CSE A & B CE0522 Web Technology<br>Mini Project Details</h1>
<p class="subtitle">Project Registration Form</p>
<div id="message" class="msg"></div>
<div class="note"><b>Important:</b> Maximum 2 students per group. HTML, CSS, JavaScript, PHP and MySQL are mandatory.</div>

<form id="projectForm">
<h2 class="section">Student Details</h2>
<div class="group">
<label>Student 1 <span class="req">*</span></label>
<select id="student1" required><option value="">-- Select Student 1 --</option></select>
</div>
<div class="group">
<label>Student 2 (Optional)</label>
<select id="student2"><option value="">-- Select Student 2 --</option></select>
</div>

<h2 class="section">Project Details</h2>
<div class="group"><label>Project Title <span class="req">*</span></label><input id="project_title" required></div>
<div class="group">
<label>Project Category <span class="req">*</span></label>
<select id="category" required>
<option value="">-- Select Category --</option>
<option>E-Commerce</option><option>Education</option><option>Healthcare</option>
<option>Banking / Finance</option><option>Management System</option>
<option>Social / Community</option><option>Entertainment</option><option>Other</option>
</select>
</div>
<div class="group"><label>Project Abstract <span class="req">*</span></label><textarea id="abstract" placeholder="Briefly describe the problem, proposed solution and purpose." required></textarea></div>
<div class="group"><label>Major Functionalities / Modules <span class="req">*</span></label><textarea id="functionalities" placeholder="Example: Login, Dashboard, CRUD, Search, Reports, Admin Panel..." required></textarea></div>
<div class="note"><b>Mandatory:</b> HTML + CSS + JavaScript + PHP + MySQL</div>
<button id="submitBtn" type="submit">Submit Project Details</button>
</form>
</div>

<script>
const API = "/api";
const s1 = document.getElementById("student1");
const s2 = document.getElementById("student2");
const form = document.getElementById("projectForm");
const msg = document.getElementById("message");
const btn = document.getElementById("submitBtn");

function showMessage(text, type){
  msg.textContent = text;
  msg.className = "msg " + type;
  msg.style.display = "block";
  window.scrollTo({top:0, behavior:"smooth"});
}
function renderStudent2(){
  const selected = s1.value;
  s2.innerHTML = '<option value="">-- Select Student 2 --</option>';
  window.students.forEach(st => {
    if (String(st.id) !== String(selected)) {
      const o = document.createElement("option");
      o.value = st.id;
      o.textContent = `${st.enrollment_no} - ${st.student_name}`;
      s2.appendChild(o);
    }
  });
}
async function loadStudents(){
  try{
    const r = await fetch(API + "/students");
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || "Unable to load students.");
    window.students = data.students || [];
    window.students.forEach(st => {
      const o = document.createElement("option");
      o.value = st.id;
      o.textContent = `${st.enrollment_no} - ${st.student_name}`;
      s1.appendChild(o);
    });
    renderStudent2();
  }catch(e){
    showMessage(e.message, "error");
    btn.disabled = true;
  }
}
s1.addEventListener("change", renderStudent2);

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  msg.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Submitting...";
  const payload = {
    student1_id: Number(s1.value),
    student2_id: s2.value ? Number(s2.value) : null,
    project_title: document.getElementById("project_title").value.trim(),
    category: document.getElementById("category").value,
    abstract: document.getElementById("abstract").value.trim(),
    functionalities: document.getElementById("functionalities").value.trim()
  };
  try{
    const r = await fetch(API + "/projects", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || "Submission failed.");
    showMessage(`Project registered successfully! Project ID: ${data.project_id}`, "success");
    form.reset();
    renderStudent2();
  }catch(e){
    showMessage(e.message, "error");
  }finally{
    btn.disabled = false;
    btn.textContent = "Submit Project Details";
  }
});
loadStudents();
</script>
</body>
</html>
